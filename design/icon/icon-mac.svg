      <path d="M76 199 L684 495" stroke="#2c9a6a" stroke-width="14" stroke-linecap="round"/>
      <path d="M684 529 L76 825" stroke="#22835a" stroke-width="14" stroke-linecap="round"/>
      <rect x="760" y="750" width="150" height="56" rx="16" fill="#e8c46a"/>
    </g>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#fff" stroke-opacity="0.08"/>
</svg>
