# Sidra Xcode project. Regenerate with `xcodegen` after editing. The .xcodeproj is not committed.
name: Sidra
options:
  bundleIdPrefix: nl.sadiq
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    visionOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    DEVELOPMENT_TEAM: KF53B4S5HD
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone added 2026-11-14: compact layout in PhoneWorkspace
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
# The iOS app and its share extension carry one version (tools/testflight.sh bumps the first CURRENT_PROJECT_VERSION).
settingGroups:
  iosVersion:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 38
packages:
  SidraDesign: { path: Packages/SidraDesign }
  SidraWorkspace: { path: Packages/SidraWorkspace }
  SidraTerminal: { path: Packages/SidraTerminal }
  SidraSSH: { path: Packages/SidraSSH }
  SidraTheasa: { path: Packages/SidraTheasa }
  SidraHackerTab: { path: Packages/SidraHackerTab }
  SidraChess: { path: Packages/SidraChess }
  Argmax:
    # WhisperKit (MIT): the optional Whisper model for dictation on the Mac (Settings → Voice).
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    revision: ea872ffd35705aa757f33033500b9b0d40bd38df
  Sparkle:
    # MIT: the Mac app's updates from GitHub releases (.github/workflows/release-mac.yml), as in Chup!.
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Sidra:
    type: application
    platform: iOS
    sources:
      - path: Sidra
        excludes: ["Info.plist", "Sidra.entitlements"]
    postBuildScripts:
      # A device demo build (tools/demo-ipad.sh) carries demo mode's fixtures; other builds skip this.
      - name: Demo fixtures
        basedOnDependencyAnalysis: false
        script: |
          [ "${SIDRA_DEMO:-}" = YES ] || exit 0
          D="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Demo"
          mkdir -p "$D/tools/dev" "$D/Packages/SidraTheasa/Tests/SidraTheasaTests"
          cp -R "$SRCROOT/tools/dev/demo-icons" "$D/tools/dev/"
          cp -R "$SRCROOT/Packages/SidraTheasa/Tests/SidraTheasaTests/Fixtures" "$D/Packages/SidraTheasa/Tests/SidraTheasaTests/"
    dependencies:
      - package: SidraDesign
      - package: SidraWorkspace
      - package: SidraTerminal
      - package: SidraSSH
      - package: SidraTheasa
      - package: SidraHackerTab
      - package: SidraChess
      - package: Argmax
        product: WhisperKit
      - target: SidraShare
        destinationFilters: [iOS]   # Vision Pro builds skip the share extension
    info:
      path: Sidra/Info.plist
      properties:
        CFBundleDisplayName: Sidra
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~iphone:   # portrait: a Pro Max in landscape reports regular width and would get the iPad layout
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true  # one WorkspaceStore per scene (decision 52)
        UIApplicationSupportsIndirectInputEvents: true
        UIUserInterfaceStyle: Dark
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Bold.ttf
          - JetBrainsMono-Variable.ttf
        NSLocalNetworkUsageDescription: Sidra connects to the SSH hosts, herdr machines and Theasa servers you add on your local network.
        NSBonjourServices: [_ssh._tcp]
        NSFaceIDUsageDescription: Sidra asks for Face ID before an SSH key marked confirm on use signs.
        NSMicrophoneUsageDescription: Sidra listens while you hold the mic. Dictation turns speech into text on this device. The voice assistant sends speech to OpenAI while its session runs.
        NSSpeechRecognitionUsageDescription: Sidra turns your dictation into text on this device.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:   # sidra://screenshot from the share extension
          - CFBundleURLName: nl.sadiq.sidra
            CFBundleURLSchemes: [sidra]
    entitlements:
      path: Sidra/Sidra.entitlements
      properties:
        # Shared with SidraShare: the Share sheet leaves screenshots in this group's Inbox (2026-11-19).
        com.apple.security.application-groups: [group.nl.sadiq.sidra]
        # Substrate approval pushes (2026-11-20). Export for App Store Connect turns it into production.
        aps-environment: development
        # iCloud sync of quick prompts and keyboard learning (2026-11-28, Sidra/Sync/CloudSync.swift). Waits for the
        # container: create iCloud.nl.kunba.sidra in the developer portal and turn on iCloud (CloudKit) for nl.sadiq.sidra,
        # then uncomment these two lines and set CloudSync.entitled to true.
        # com.apple.developer.icloud-container-identifiers: [iCloud.nl.kunba.sidra]
        # com.apple.developer.icloud-services: [CloudKit]
    settings:
      groups: [iosVersion]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.sadiq.sidra
        PRODUCT_NAME: Sidra
        # Apple Vision Pro added 2026-11-24 (Waseem): the same target, a session list plus one window per herdr space (VisionApp.swift).
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator xros xrsimulator"
        TARGETED_DEVICE_FAMILY: "1,2,7"
        XROS_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xr*]": AppIcon-vision   # a layered image stack: visionOS draws its own depth
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        OTHER_LDFLAGS: ["-ObjC"]
  # "Sidra" in the Share sheet (the screenshot editor's included): the image goes to the App Group's Inbox,
  # where Sidra picks it up on the Send screenshot sheet.
  SidraShare:
    type: app-extension
    platform: iOS
    sources:
      - path: SidraShare
        excludes: ["Info.plist", "SidraShare.entitlements"]
    info:
      path: SidraShare/Info.plist
      properties:
        CFBundleDisplayName: Sidra
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: SidraShare/SidraShare.entitlements
      properties:
        com.apple.security.application-groups: [group.nl.sadiq.sidra]
    settings:
      groups: [iosVersion]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.sadiq.sidra.share
        PRODUCT_NAME: SidraShare
  # The native Mac app (decided 2026-11-17, replacing the Designed-for-iPad build): same sources,
  # AppKit where UIKit differs. Ships outside the App Store with Developer ID and Sparkle.
  SidraMac:
    type: application
    platform: macOS
    sources:
      - path: Sidra
        excludes: ["Info.plist", "Sidra.entitlements", "SidraMac.entitlements"]
    dependencies:
      - package: SidraDesign
      - package: SidraWorkspace
      - package: SidraTerminal
      - package: SidraSSH
      - package: SidraTheasa
      - package: SidraHackerTab
      - package: SidraChess
      - package: Argmax
        product: WhisperKit
      - package: Sparkle
        product: Sparkle
    info:
      path: build/SidraMac-Info.plist
      properties:
        CFBundleDisplayName: Sidra
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
        ATSApplicationFontsPath: .
        NSLocalNetworkUsageDescription: Sidra connects to the SSH hosts, herdr machines and Theasa servers you add on your local network.
        NSBonjourServices: [_ssh._tcp]
        NSMicrophoneUsageDescription: Sidra listens while you dictate. Dictation turns speech into text on this Mac. The voice assistant sends speech to OpenAI while its session runs.
        NSSpeechRecognitionUsageDescription: Sidra turns your dictation into text on this Mac.
        ITSAppUsesNonExemptEncryption: false
        # Sparkle: the appcast each release publishes, and the public half of the EdDSA key that
        # signs it (~/Desktop/sidra-updater-key). AppUpdater only starts in a copy under /Applications.
        SUFeedURL: https://github.com/Kunba-Labs/sidra/releases/latest/download/appcast.xml
        SUPublicEDKey: aT6Y2+a+Zo2O/jOURp7BSKeIh1zH1BL/XyyDm2GaLqI=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 3600
    entitlements:
      path: Sidra/SidraMac.entitlements
      properties:
        com.apple.security.device.audio-input: true   # the microphone under the hardened runtime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.sadiq.sidra.mac
        PRODUCT_NAME: Sidra
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 14
        SUPPORTED_PLATFORMS: macosx
        TARGETED_DEVICE_FAMILY: ""
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["-ObjC"]
  SidraTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/SidraTests]
    # Only the host app: linking packages here too makes Xcode build them as dynamic products
    # and the Crypto framework never gets staged. Modules are still importable through the host.
    dependencies:
      - target: Sidra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.sadiq.sidra.tests
        GENERATE_INFOPLIST_FILE: YES
  SidraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/SidraUITests]
    dependencies:
      - target: Sidra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.sadiq.sidra.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Sidra:
    build:
      targets:
        Sidra: all
        SidraTests: [test]
        SidraUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # UI tests write landscape screenshots here (ShellUITests.saveScreenshot).
      environmentVariables:
        SIDRA_SHOT_PATH: $(SRCROOT)/build/shots/shot.png
      targets:
        - SidraTests
        - SidraUITests
        - package: SidraDesign/SidraDesignTests
        - package: SidraWorkspace/SidraWorkspaceTests
        - package: SidraTerminal/SidraTerminalTests
        - package: SidraTheasa/SidraTheasaTests
        - package: SidraHackerTab/SidraHackerTabTests
        - package: SidraChess/SidraChessTests
        # Packages that link Citadel (NIOSSH, swift-crypto) cannot run as package test bundles
        # from this scheme: Xcode fails to stage the dynamic Crypto package product. Their tests
        # live in Tests/SidraTests instead (see docs/DECISIONS.md).
    archive:
      config: Release
  SidraMac:
    build:
      targets:
        SidraMac: all
    run:
      config: Debug
    archive:
      config: Release
